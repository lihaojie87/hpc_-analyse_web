[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hpc-perf-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
 "fastapi>=0.115.0", "uvicorn[standard]>=0.30.0", "sqlalchemy[asyncio]>=2.0.35",
 "alembic>=1.13.0", "asyncpg>=0.29.0", "aiosqlite>=0.20.0", "psycopg[binary]>=3.1.0",
 "pydantic>=2.8.0", "pydantic-settings>=2.4.0", "pyjwt>=2.9.0", "bcrypt>=4.1.0",
 "structlog>=24.1.0", "redis>=5.0.0", "pytest>=8.2.0", "pytest-asyncio>=0.23.0", "httpx>=0.27.0"
]
[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
