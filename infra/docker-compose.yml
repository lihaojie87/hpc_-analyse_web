services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    # Internal-only by default; opt in to host access with POSTGRES_BIND.
    ports: ["${POSTGRES_BIND:-127.0.0.1}:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    # Internal-only by default; opt in to host access with REDIS_BIND.
    ports: ["${REDIS_BIND:-127.0.0.1}:6379:6379"]
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes: ["./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
    environment:
      HPC_ENV: ${HPC_ENV:-prod}
      HPC_APP_NAME: ${HPC_APP_NAME:-HPC Performance Platform}
      HPC_DATABASE_URL: ${HPC_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}}
      HPC_REDIS_URL: ${HPC_REDIS_URL:-redis://redis:6379/0}
      HPC_JWT_SECRET: ${HPC_JWT_SECRET:?HPC_JWT_SECRET must be set}
      HPC_CORS_ORIGINS: ${HPC_CORS_ORIGINS:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build:
      context: ../frontend
    depends_on:
      - backend
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
